name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate and test credential attribution
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -buildmode=c-shared -trimpath -o /tmp/free-model-hub.so .
